# Dogfood: review the support agent on every PR with the repo's own Action.
# Needs a reachable Popcorn instance: set the POPCORN_ENDPOINT variable and the
# POPCORN_API_KEY secret. Runs offline (no model spend) unless SUPPORT_AGENT_LIVE
# is "true", in which case ANTHROPIC_API_KEY must be set.
name: Popcorn review

on:
  pull_request:
  push:
    branches: [main]

jobs:
  review:
    if: vars.POPCORN_ENDPOINT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      POPCORN_ENDPOINT: ${{ vars.POPCORN_ENDPOINT }}
      POPCORN_API_KEY: ${{ secrets.POPCORN_API_KEY }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      SUPPORT_AGENT_OFFLINE: ${{ vars.SUPPORT_AGENT_LIVE == 'true' && 'false' || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm turbo run build --filter=@popcorn-ai/cli...
      - uses: ./.github/actions/review
        with:
          suite: support-v1
          working-directory: examples/support-agent
