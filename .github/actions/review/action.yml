name: Popcorn review
description: Run a Popcorn eval suite on your agent and post the result on the pull request
author: popcorn-ai
branding:
  icon: film
  color: red

inputs:
  suite:
    description: Dataset (suite) to run
    required: true
  config:
    description: Path to popcorn.config.ts, relative to working-directory
    default: ''
  working-directory:
    description: Directory that contains popcorn.config.ts and has @popcorn-ai/cli installed
    default: '.'
  baseline-branch:
    description: Branch whose latest eval run is the baseline
    default: main
  repeat:
    description: Run each case this many times to detect flaky cases
    default: '1'
  fail-on:
    description: Fail the job on "regression" (default), "any" failing case, or "never"
    default: regression
  comment:
    description: Post or update a comment on the pull request
    default: 'true'
  github-token:
    description: Token used to comment
    default: ${{ github.token }}

outputs:
  exit-code:
    description: Exit code of popcorn review (0 ok, 1 regression or failures, 2 error)
    value: ${{ steps.review.outputs.exit-code }}
  report:
    description: Path to the markdown report
    value: ${{ steps.review.outputs.report }}

runs:
  using: composite
  steps:
    - id: review
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      env:
        SUITE: ${{ inputs.suite }}
        CONFIG: ${{ inputs.config }}
        BASELINE: ${{ inputs.baseline-branch }}
        REPEAT: ${{ inputs.repeat }}
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        report="$RUNNER_TEMP/popcorn-review-${SUITE//[^a-zA-Z0-9_-]/_}.md"
        set +e
        npx --no-install popcorn review \
          --suite "$SUITE" \
          ${CONFIG:+--config "$CONFIG"} \
          --baseline "$BASELINE" \
          --repeat "$REPEAT" \
          --fail-on "$FAIL_ON" \
          --output "$report"
        code=$?
        set -e
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"
        echo "report=$report" >> "$GITHUB_OUTPUT"
        if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi

    - if: inputs.comment == 'true' && github.event_name == 'pull_request'
      uses: actions/github-script@v7
      env:
        REPORT: ${{ steps.review.outputs.report }}
        SUITE: ${{ inputs.suite }}
      with:
        github-token: ${{ inputs.github-token }}
        script: |
          const fs = require('node:fs');
          if (!fs.existsSync(process.env.REPORT)) {
            core.warning('popcorn review produced no report; skipping the comment');
            return;
          }
          const body = fs.readFileSync(process.env.REPORT, 'utf8');
          const marker = `<!-- popcorn-review:${process.env.SUITE} -->`;
          const { owner, repo } = context.repo;
          const issue_number = context.issue.number;
          const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
          const previous = comments.find((c) => c.body?.includes(marker));
          if (previous) {
            await github.rest.issues.updateComment({ owner, repo, comment_id: previous.id, body });
          } else {
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
          }

    - if: steps.review.outputs.exit-code != '0'
      shell: bash
      run: |
        echo "popcorn review exited with ${{ steps.review.outputs.exit-code }}"
        exit 1
